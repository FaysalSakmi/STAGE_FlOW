name: Deploy to Faable
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - run: npm ci
      - name: Write secrets to env.json
        run: |
          echo "{\"AIRTABLE_API_KEY\":\"${{ secrets.AIRTABLE_API_KEY }}\",\"AIRTABLE_BASE_ID\":\"${{ secrets.AIRTABLE_BASE_ID }}\",\"AIRTABLE_TABLE_NAME\":\"${{ secrets.AIRTABLE_TABLE_NAME }}\"}" > env.json
      - run: npx @faable/faable@latest deploy
